spring:
  application:
    name: shop-api

  datasource:
    url: jdbc:h2:mem:shopdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

logging:
  level:
    com.example.shop: DEBUG
    org.springframework.web: INFO