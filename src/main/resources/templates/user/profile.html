<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Профиль пользователя</title>
</head>
<body>
<h1>Профиль пользователя</h1>

<div th:if="${avatar}">
    <img th:src="${avatar}" alt="Аватар" width="100">
</div>

<p><strong>Имя:</strong> <span th:text="${name}"></span></p>
<p><strong>Логин:</strong> <span th:text="${login}"></span></p>
<p><strong>ID:</strong> <span th:text="${id}"></span></p>
<p><strong>Email:</strong> <span th:text="${email}"></span></p>

<br>
<a href="/">На главную</a>
<br>
<a href="/logout">Выйти</a>
</body>
</html>
