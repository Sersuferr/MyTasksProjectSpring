<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Главная страница</title>
</head>
<body>
<h1>Добро пожаловать!</h1>

<div th:if="${user}">
    <p>Вы вошли как: <span th:text="${user.name}"></span></p>
    <p>Email: <span th:text="${user.email}"></span></p>
    <a href="/user/profile">Перейти в профиль</a>
    <br>
    <a href="/admin/dashboard" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
        Админ панель
    </a>
    <br>
    <a href="/logout">Выйти</a>
</div>

<div th:unless="${user}">
    <p>Пожалуйста, войдите в систему:</p>
    <a href="/oauth2/authorization/github">Войти через GitHub</a>

</div>
</body>
</html>
